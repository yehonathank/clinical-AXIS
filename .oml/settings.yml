# oml-code settings
oml-code:
  schemaVersion: 1

# project npm settings
project:
  name: "axis"
  version: 0.1.0
  title: Clinical AXIS
  description: "Clinical AXIS (Auditable X-dimensional Implementation Standards) is a formal ontology designed to evaluate and verify real-world clinical AI readiness across the multi-phase SALIENT lifecycle. By encoding rigorous reporting rules and machine-actionable validation axioms across AI models, data pipelines, user interfaces, and clinical workflows, the system provides transparent audit trails for hospital governance committees. Ultimately, this framework bridges the gap between fragmented retrospective accuracy metrics and multi-component operational safety to ensure safe, reproducible AI deployment."

# source folders
sources:
  - src

# oml server settings
# By default the server binds a free port chosen by the OS (the actual port is
# reported by 'oml list'), so multiple workspaces never collide. Uncomment to
# pin a fixed port instead — but make sure no other workspace uses the same one.
# server:
#   port: 8080

# Default CLI arguments per command, injected before your own (so you can override them on the
# command line). Works for any oml command; key by command name. For example:
# defaults:
#   export: -o build/owl
#   reason: -o build/owl -t
